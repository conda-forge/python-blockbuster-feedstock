# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.29"
  python_check_max: "3.14"

package:
  name: python-blockbuster
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/blockbuster/blockbuster-${{ version }}.tar.gz
  sha256: 0fd507a4a115eb93eddf580d7a0c29f0a8ef2d447ded7f853d0cf9ab1cf9787d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - forbiddenfruit >=0.1.4
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - blockbuster/**
        - blockbuster-${{ version }}.dist-info/**
  - python:
      imports: blockbuster
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - pytest-asyncio
        - pytest-cov
        - python ${{ python_min }}.*
        - requests
    script:
      - coverage run --source=blockbuster --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=89

about:
  homepage: https://pypi.org/project/blockbuster
  repository: https://github.com/cbornet/blockbuster
  license_file: LICENSE
  license: Apache-2.0
  summary: Utility to detect blocking calls in the async event loop

extra:
  recipe-maintainers:
    - bollwyvl
